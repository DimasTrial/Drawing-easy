<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trace Tool - Dimas</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Video Kamera di Background */
        #camera {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Gambar Overlay */
        #overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%; max-height: 90%;
            z-index: 2;
            opacity: 0.5;
            pointer-events: none; /* Biar gak ganggu klik */
        }

        /* Panel Kontrol di Bawah */
        .controls {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
        }

        input[type="range"] { width: 100%; accent-color: #00ffcc; }
        button, label {
            background: #00ffcc; color: #000;
            padding: 10px; border: none; border-radius: 5px;
            text-align: center; font-weight: bold; cursor: pointer;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="camera" autoplay playsinline></video>
    <img id="overlay" src="" style="display: none;">

    <div class="controls">
        <label for="upload">Pilih Gambar Galeri</label>
        <input type="file" id="upload" accept="image/*">
        
        <span style="color: white; font-size: 12px;">Transparansi:</span>
        <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.5">
        
        <button onclick="rotateImg()">Putar Gambar 90°</button>
    </div>

    <script>
        const video = document.getElementById('camera');
        const overlay = document.getElementById('overlay');
        const upload = document.getElementById('upload');
        const opacity = document.getElementById('opacity');
        let rotation = 0;

        // Nyalakan Kamera Belakang
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal akses kamera: " + err);
            }
        }

        // Handle Upload Gambar
        upload.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                overlay.src = URL.createObjectURL(file);
                overlay.style.display = 'block';
            }
        };

        // Handle Transparansi
        opacity.oninput = () => {
            overlay.style.opacity = opacity.value;
        };

        // Fitur Tambahan: Putar Gambar
        function rotateImg() {
            rotation += 90;
            overlay.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
        }

        startCamera();
    </script>
</body>
</html>
