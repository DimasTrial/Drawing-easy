<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trace Tool - Dimas</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; font-family: sans-serif; 
        }
        
        #camera {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        #overlay {
            max-width: 100%; max-height: 100%;
            opacity: 0.5;
            transform-origin: center; 
        }

        /* Panel Kontrol */
        .controls {
            position: fixed;
            bottom: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
            max-height: 55vh;
            overflow-y: auto;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .controls.hidden {
            transform: translateX(-50%) translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        /* Tombol Toggle (Simbol Garis) */
        #toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 11;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
        }

        .icon-bar {
            width: 22px;
            height: 2px;
            background: #000;
            position: relative;
            transition: 0.3s;
        }

        .icon-bar::before, .icon-bar::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 2px;
            background: #000;
            left: 0;
            transition: 0.3s;
        }

        .icon-bar::before { top: -7px; }
        .icon-bar::after { bottom: -7px; }

        /* Animasi simbol silang */
        .active .icon-bar { background: transparent; }
        .active .icon-bar::before { transform: rotate(45deg); top: 0; }
        .active .icon-bar::after { transform: rotate(-45deg); bottom: 0; }

        .slider-group { display: flex; flex-direction: column; }
        label { color: #00ffcc; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }

        input[type="range"] { width: 100%; accent-color: #00ffcc; cursor: pointer; margin-bottom: 5px; }
        
        .btn-row { display: flex; gap: 8px; margin-top: 5px; }
        button, .upload-btn {
            flex: 1; background: #00ffcc; color: #000;
            padding: 10px; border: none; border-radius: 8px;
            text-align: center; font-weight: bold; cursor: pointer;
            font-size: 11px; transition: 0.2s;
        }

        #lockBtn.locked {
            background: #ffcc00;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="camera" autoplay playsinline></video>
    
    <div id="container">
        <img id="overlay" src="" style="display: none;">
    </div>

    <button id="toggle-btn" onclick="toggleMenu()" class="active">
        <div class="icon-bar"></div>
    </button>

    <div class="controls" id="controlsPanel">
        <label class="upload-btn" for="upload">PILIH GAMBAR</label>
        <input type="file" id="upload" accept="image/*">
        
        <div class="slider-group">
            <label>Transparansi</label>
            <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="slider-group">
            <label>Ukuran (Zoom)</label>
            <input type="range" id="scale" min="0.1" max="5" step="0.01" value="1">
        </div>

        <div class="slider-group">
            <label>Posisi (X & Y)</label>
            <input type="range" id="posX" min="-400" max="400" step="1" value="0">
            <input type="range" id="posY" min="-600" max="600" step="1" value="0">
        </div>
        
        <div class="btn-row">
            <button onclick="rotateImg()">PUTAR 90°</button>
            <button id="lockBtn" onclick="toggleLock()">LOCK FOCUS</button>
            <button onclick="resetPos()" style="background: #ff4444; color: white;">RESET</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const overlay = document.getElementById('overlay');
        const upload = document.getElementById('upload');
        const controlsPanel = document.getElementById('controlsPanel');
        const toggleBtn = document.getElementById('toggle-btn');
        const lockBtn = document.getElementById('lockBtn');
        
        const opacity = document.getElementById('opacity');
        const scale = document.getElementById('scale');
        const posX = document.getElementById('posX');
        const posY = document.getElementById('posY');

        let rotation = 0;
        let videoTrack = null;
        let isLocked = false;

        // Jalankan Kamera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        focusMode: "continuous" 
                    } 
                });
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
            } catch (err) {
                alert("Akses kamera ditolak atau tidak didukung.");
            }
        }

        // Fitur Lock Focus (Hanya bekerja di browser tertentu seperti Chrome Android)
        async function toggleLock() {
            if (!videoTrack) return;
            
            try {
                const capabilities = videoTrack.getCapabilities();
                
                if (capabilities.focusMode) {
                    if (!isLocked) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: "manual" }] });
                        isLocked = true;
                        lockBtn.innerText = "LOCKED";
                        lockBtn.classList.add('locked');
                    } else {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                        isLocked = false;
                        lockBtn.innerText = "LOCK FOCUS";
                        lockBtn.classList.remove('locked');
                    }
                } else {
                    alert("Fitur pengunci fokus tidak didukung oleh hardware/browser ini.");
                }
            } catch (e) {
                console.log("Focus control not supported.");
            }
        }

        // Hide/Show Menu
        function toggleMenu() {
            const isHidden = controlsPanel.classList.toggle('hidden');
            toggleBtn.classList.toggle('active');
        }

        // Update Transform Gambar
        function updateTransform() {
            overlay.style.transform = `translate(${posX.value}px, ${posY.value}px) rotate(${rotation}deg) scale(${scale.value})`;
        }

        upload.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                overlay.src = URL.createObjectURL(file);
                overlay.style.display = 'block';
            }
        };

        opacity.oninput = () => overlay.style.opacity = opacity.value;
        scale.oninput = updateTransform;
        posX.oninput = updateTransform;
        posY.oninput = updateTransform;

        function rotateImg() {
            rotation += 90;
            updateTransform();
        }

        function resetPos() {
            rotation = 0;
            scale.value = 1;
            posX.value = 0;
            posY.value = 0;
            opacity.value = 0.5;
            overlay.style.opacity = 0.5;
            updateTransform();
        }

        startCamera();
    </script>
</body>
</html>
